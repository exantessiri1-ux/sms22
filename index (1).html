<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Знакомства</title>
<style>
  :root{
    --bg:#0c0816; --card-top:#22173d; --card-bot:#171027;
    --text:#fff; --muted:#a79fc0; --accent:#d86bd0;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;background:var(--bg)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(120% 40% at 50% 0%, #2a1646 0%, rgba(42,22,70,0) 100%),
      var(--bg);
    min-height:100vh;
    padding:calc(env(safe-area-inset-top,0px) + 44px) 24px calc(env(safe-area-inset-bottom,0px) + 28px);
    display:flex;justify-content:center;
  }
  .app{width:100%;max-width:440px}

  .top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .ava{
    width:46px;height:46px;border-radius:14px;flex:none;object-fit:cover;
    border:2px solid #d7d3e0;background:#1c1530;
  }
  .top-title{
    flex:1;font-size:17px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  }
  .fire{
    width:44px;height:44px;flex:none;border-radius:14px;
    background:#120d1f;border:1px solid #2a2240;
    display:flex;align-items:center;justify-content:center;font-size:22px;
  }

  .card{
    border-radius:30px;
    padding:26px 24px 26px;
    background:linear-gradient(180deg,var(--card-top),var(--card-bot));
    border:1px solid #2c2347;
    text-align:center;
  }
  .mascot{display:block;width:84%;max-width:300px;margin:0 auto 4px}
  h1{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:6px 0 14px}
  .sub{font-size:17px;color:var(--muted);font-weight:500;margin-bottom:26px}
  .stats{display:flex;justify-content:space-between;gap:6px;margin-bottom:24px}
  .stat{flex:1}
  .stat b{display:block;font-size:30px;font-weight:800;color:var(--accent);letter-spacing:-.02em;white-space:nowrap}
  .stat span{display:block;margin-top:8px;font-size:15px;line-height:1.25;color:var(--muted);font-weight:500}

  .cta{
    display:flex;align-items:center;justify-content:center;
    width:100%;height:56px;border:0;border-radius:28px;cursor:pointer;
    font:inherit;font-size:19px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#fff;
    background:linear-gradient(90deg,#f0609f 0%,#c452e4 55%,#7b5cf0 100%);
    box-shadow:0 8px 24px rgba(196,82,228,.25);
    transition:transform .12s ease, filter .12s ease;
  }
  .cta:active{transform:scale(.98);filter:brightness(1.08)}
  .cta:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
